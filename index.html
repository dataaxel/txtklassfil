<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Textklassificering Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 1rem; }
        textarea { width: 100%; height: 100px; padding: 10px; margin-bottom: 1rem; }
        button { padding: 10px 20px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        button:disabled { background: #ccc; }
        #result { margin-top: 1rem; font-weight: bold; }
        .bar-container { background: #eee; height: 20px; width: 100%; margin: 5px 0; border-radius: 4px; }
        .bar { height: 100%; text-align: right; padding-right: 5px; color: white; font-size: 12px; border-radius: 4px; }
    </style>
</head>
<body>

    <h2>Analysera omdöme</h2>
    <p>Skriv en recension så gissar AI:n om den är Positiv, Neutral eller Negativ.</p>
    
    <textarea id="textInput" placeholder="Skriv här, t.ex: 'Vilken fantastisk film!'"></textarea>
    <br>
    <button id="predictBtn" onclick="predict()" disabled>Laddar modell...</button>
    
    <div id="result"></div>

    <script>
        let model = null;
        let tokenizerData = null;
        const N_WORDS = 1000; // Måste matcha Colab (N=1000)

        // 1. Ladda modell och tokenizer
        async function loadAssets() {
            try {
                // Justera sökvägen om mappen heter något annat
                model = await tf.loadLayersModel('./tfjs_model/model.json');
                
                const response = await fetch('./tfjs_model/tokenizer.json');
                tokenizerData = await response.json();
                
                document.getElementById('predictBtn').innerText = "Analysera";
                document.getElementById('predictBtn').disabled = false;
                console.log("Modell och tokenizer laddad!");
            } catch (err) {
                console.error("Fel vid laddning:", err);
                document.getElementById('result').innerText = "Kunde inte ladda modellen. Se konsolen (F12).";
            }
        }

        loadAssets();

        // 2. Normalisera text (Samma som Python: normalize_text)
        function normalize(text) {
            return text.toLowerCase()
                // Ersätt allt utom a-z, åäö, 0-9 med mellanslag
                .replace(/[^a-zåäö0-9\s]+/g, ' ') 
                // Ta bort extra mellanslag
                .replace(/\s+/g, ' ')
                .trim();
        }

        // 3. Skapa BoW-vektor (Samma som Python)
        function vectorize(text) {
            const words = normalize(text).split(' ');
            const vector = new Float32Array(N_WORDS); // Skapar array med 1000 nollor
            
            // word_index i Python börjar på 1. 
            // Vår vektor är 0-indexerad. Så word_index 1 hamnar på vector[0].
            
            let wordCount = 0;
            words.forEach(word => {
                const idx = tokenizerData.word_index[word];
                // Om ordet finns och är inom våra topp 1000 ord
                if (idx !== undefined && idx >= 1 && idx <= N_WORDS) {
                    vector[idx - 1] += 1.0;
                    wordCount++;
                }
            });

            // Normalisera med summan (precis som i Colab: X[r] /= s)
            const sum = vector.reduce((a, b) => a + b, 0);
            if (sum > 0) {
                for (let i = 0; i < vector.length; i++) {
                    vector[i] /= sum;
                }
            }
            
            return vector;
        }

        // 4. Gör förutsägelse
        async function predict() {
            const text = document.getElementById('textInput').value;
            if (!text.trim()) return;

            // Skapa tensor [1, 1000]
            const vec = vectorize(text);
            const inputTensor = tf.tensor2d([vec], [1, N_WORDS]);

            const prediction = model.predict(inputTensor);
            const scores = await prediction.data(); // Array med 3 sannolikheter
            
            // Hitta index med högst värde
            const classIndex = scores.indexOf(Math.max(...scores));
            const labels = tokenizerData.classes || ['Negativ', 'Neutral', 'Positiv'];
            
            // Visa resultat
            const resDiv = document.getElementById('result');
            resDiv.innerHTML = `<h3>Resultat: ${labels[classIndex]}</h3>`;
            
            // Visa staplar för varje klass
            labels.forEach((label, i) => {
                const pct = (scores[i] * 100).toFixed(1);
                const color = i === 0 ? '#dc3545' : (i === 1 ? '#ffc107' : '#28a745'); // Röd, Gul, Grön
                resDiv.innerHTML += `
                    <div>${label} (${pct}%)</div>
                    <div class="bar-container">
                        <div class="bar" style="width: ${pct}%; background: ${color};"></div>
                    </div>
                `;
            });

            // Städa upp minne
            inputTensor.dispose();
            prediction.dispose();
        }
    </script>
</body>
</html>
